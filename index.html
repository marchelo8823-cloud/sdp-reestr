<meta name="robots" content="noindex"><style>*{box-sizing:border-box}body{margin:0}/* Реестр: служебный документ-вид. Шапка-полоса цвета морской карты, светлое поле, моноширинные номера и коды. */

.tech{margin-top:14px}.tech summary{cursor:pointer;color:var(--mut);font-size:13px}.tech dl{margin-top:10px}

[hidden]{display:none!important}

.big-v{margin-top:0}.big-v b{font-size:22px}

<script>/* Общие функции реестра СДП: отпечаток SHA-256 и номер-якорь. Одинаковы в программе и в реестре. */
const SDPC=(()=>{
const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes){if(typeof bytes==='string')bytes=new TextEncoder().encode(bytes);else if(bytes instanceof ArrayBuffer)bytes=new Uint8Array(bytes);
 const l=bytes.length,nb=((l+9+63)>>6)<<6,m=new Uint8Array(nb);m.set(bytes);m[l]=0x80;const bl=l*8;const dv=new DataView(m.buffer);dv.setUint32(nb-4,bl>>>0);dv.setUint32(nb-8,Math.floor(bl/4294967296));
 let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;const w=new Uint32Array(64);
 for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3),s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;for(let i=0;i<64;i++){const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
  h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;h5=(h5+f)|0;h6=(h6+g)|0;h7=(h7+h)|0}
 return[h0,h1,h2,h3,h4,h5,h6,h7].map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
function canon(v){if(v===null||typeof v!=='object')return JSON.stringify(v===undefined?null:v);if(Array.isArray(v))return'['+v.map(canon).join(',')+']';return'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'}
const TR={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
function anchor(num){return String(num||'').toLowerCase().split('').map(c=>TR[c]??c).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function short(fp){return String(fp||'').slice(0,16).toUpperCase().replace(/(.{4})(?=.)/g,'$1-')}
function testsDigest(tests){return sha256(canon((tests||[]).map(t=>({num:t.num||'',title:t.title||'',status:t.status||'',actual:t.actual||'',measured:t.measured||'',comment:t.comment||'',date:t.date||'',witness:t.witness||'',cat:t.cat||'',finding:t.finding||''}))))}
function fingerprint(rec){const r={...rec};delete r.fp;return sha256(canon(r))}
return{sha256,canon,anchor,short,testsDigest,fingerprint};})();
</script><script>"use strict";
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{if(!s)return'—';const[y,m,d]=String(s).slice(0,10).split('-');return d?`${d}.${m}.${y}`:s};
const KIND={annual:'Ежегодные испытания',fiveyear:'Пятилетние испытания АВПО',initial:'Первоначальные испытания АВПО',modif:'После изменений / ремонта'};
const QUALS=[['Свидетельство № IDP-2448/26','Подготовка операторов динамического позиционирования судов — базовый курс (раздел B-V/f Кодекса ПДНВ)','ГУМРФ им. адм. С.О. Макарова, Морской учебно-тренажёрный центр','06.03.2026','info@mtc.spb.su, +7 (812) 444-00-04'],['Свидетельство № DPM-1221/24 D','Обслуживание судового оборудования динамического позиционирования (НАВИС, Kongsberg)','ГУМРФ им. адм. С.О. Макарова, МУТЦ; НАВИС','29.02.2024','info@mtc.spb.su, +7 (812) 444-00-04'],['Сертификат № 2429','Ознакомление с системами ДП (НАМП ДП 4; IMCA M 117), испытания системы ДП','Marine Prof, курс одобрен НАМП','10.04.2024','admin@marineprof.com']];
let R=[],META={},state='load',verdict=null,vnum='',vcode='';
const byNum=n=>R.find(r=>SDPC.anchor(r.number)==SDPC.anchor(n));
const openLeft=r=>(r.open||[]).map((o,i)=>({...o,i})).filter(o=>!(r.closed||[]).some(c=>c.i===o.i));
function stv(r){return r.status=='аннулирован'?{c:'bad',t:'Документ аннулирован'}:r.status=='заменён'?{c:'mid',t:'Документ заменён новой редакцией'}:{c:'ok',t:'Документ подлинный и действителен'}}
function render(){const h=decodeURIComponent(location.hash.slice(1));const rec=h&&state=='ok'?R.find(r=>SDPC.anchor(r.number)==h):null;
 $('#root').innerHTML=`<header class="band"><div class="wrap hd"><div class="eyebrow">Независимый эксперт СДП · Марченко Е.С.</div><h1>Проверка документов испытаний СДП</h1><p class="lede">Реестр отчётов и заключений об испытаниях систем динамического позиционирования судов.</p></div></header>
 <main class="wrap">${state=='load'?'<p class="hint">Загрузка реестра…</p>':state=='err'?'<div class="verdict bad"><b>Реестр не загрузился</b><div>Проверьте подключение к интернету и обновите страницу.</div></div>':
 rec?banner(rec)+card(rec)+'<p class="foot"><a href="#">Проверить другой документ</a></p>':h?`<div class="verdict bad"><b>Документ не найден в реестре</b><div>Номер из ссылки «${esc(h)}» не зарегистрирован. Документ без записи в реестре не подтверждён.</div></div>${verify()}`:verify()+expert()}
 <footer class="foot">Записей в реестре: ${R.length}${META.updated?` · обновлено ${fmt(META.updated)}`:''}</footer></main>`;bind()}
function banner(r){const v=stv(r);const left=openLeft(r).length;return`<section class="verdict ${v.c} big-v"><b>${v.t}</b><div>${esc(r.vessel?.name)}, ИМО ${esc(r.vessel?.imo)} · ${esc(KIND[r.trial?.kind]||'')} ${fmt(r.trial?.dateFrom)} – ${fmt(r.trial?.dateTo)}<br>${r.result?.ok?'Система ДП соответствует классу 2 (DYNPOS-2)':'Не соответствует до устранения замечаний'}${(r.open||[]).length?` · открытых замечаний: ${left}`:''}</div></section>`}
function card(r){const t=r.trial||{},v=r.vessel||{},c=r.counts||{},f=r.findings||{};const L=openLeft(r),C=r.closed||[];
 return`<section class="panel"><div class="bar"><div><div class="eyebrow mut">Запись реестра</div><h2 class="mono big">${esc(r.number)}</h2></div><div class="code"><span>Код проверки</span><b class="mono">${SDPC.short(r.fp)}</b></div></div>
 ${r.status=='аннулирован'?`<div class="verdict bad"><b>Аннулирован</b><div>${esc(r.statusNote||'')}</div></div>`:r.status=='заменён'?`<div class="verdict mid"><b>Заменён новой редакцией</b><div>${r.supersededBy?`Действующая редакция: <a href="#${SDPC.anchor(r.supersededBy)}">${esc(r.supersededBy)}</a>`:''}</div></div>`:''}
 <dl><dt>Судно</dt><dd>${esc(v.name)}</dd><dt>ИМО</dt><dd class="mono">${esc(v.imo)}</dd><dt>Символ класса</dt><dd>${esc(v.classNotation)}</dd><dt>Судовладелец</dt><dd>${esc(v.owner)}${v.branch?', '+esc(v.branch):''}</dd>
 <dt>Испытания</dt><dd>${esc(KIND[t.kind]||t.kind)}</dd><dt>Период и место</dt><dd>${fmt(t.dateFrom)} – ${fmt(t.dateTo)}${t.place?', '+esc(t.place):''}</dd><dt>Отчёт</dt><dd>№ ${esc(r.number)} от ${fmt(t.reportDate)}, выпущен ${fmt(r.issuedAt)}</dd>${r.programme?`<dt>Программа</dt><dd>${esc(r.programme)}</dd>`:''}
 <dt>Итог</dt><dd>${r.result?.ok?'<span class="chip ok">соответствует классу 2</span>':'<span class="chip bad">не соответствует до устранения замечаний</span>'}</dd>
 ${c.total?`<dt>Тесты</dt><dd class="num">${c.total} всего · ${c.ok||0} как ожидалось · ${c.fail||0} не как ожидалось · ${c.skip||0} не выполнено</dd>`:''}<dt>Замечания A / B / C</dt><dd class="num">${f.A||0} / ${f.B||0} / ${f.C||0} по отчёту${C.length?` · устранено ${C.length}`:''}</dd>
 <dt>Эксперт СДП</dt><dd>${esc(r.expert)}${(r.expertQuals||[]).length?`<div class="sub">${r.expertQuals.map(esc).join(' · ')}</div>`:''}</dd>
 <dt>Следующие ежегодные</dt><dd>${fmt(r.next?.annualFrom)} – ${fmt(r.next?.annualTo)}</dd>${r.next?.five?`<dt>Следующие 5-летние АВПО</dt><dd>не позднее ${fmt(r.next.five)}</dd>`:''}
 ${r.reissueOf?`<dt>Переоформлен</dt><dd>взамен: ${esc(r.reissueOf)}</dd>`:''}${r.note?`<dt>Примечание</dt><dd>${esc(r.note)}</dd>`:''}</dl>
 ${L.length?`<h3>Открытые замечания</h3><div class="tw"><table><thead><tr><th>Кат.</th><th>Замечание</th><th>Срок</th></tr></thead><tbody>${L.map(o=>`<tr><td>${esc(o.cat)}</td><td>${esc(o.text)}</td><td>${esc(o.deadline||'')}</td></tr>`).join('')}</tbody></table></div>`:(r.open||[]).length?'<p class="ok-t"><b>Все замечания устранены.</b></p>':''}
 ${C.length?`<h3>Устранённые замечания</h3><div class="tw"><table><thead><tr><th>Кат.</th><th>Замечание</th><th>Устранено</th><th>Подтверждение</th></tr></thead><tbody>${C.map(x=>`<tr><td>${esc(x.cat)}</td><td>${esc(x.text)}</td><td class="num">${fmt(x.date)}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</tbody></table></div>`:''}
 ${(r.files||[]).length?`<h3>Зарегистрированные файлы</h3><p class="hint">Перетащите файл документа в поле проверки ниже — он сравнится с этими отпечатками.</p><div class="tw"><table><thead><tr><th>Файл</th><th>SHA-256</th></tr></thead><tbody>${r.files.map(x=>`<tr><td>${esc(x.name)}</td><td class="mono sm">${esc(x.sha256)}</td></tr>`).join('')}</tbody></table></div>`:''}
 <details class="tech"><summary>Технические данные</summary><dl><dt>Отпечаток записи (SHA-256)</dt><dd class="mono sm">${esc(r.fp)}</dd><dt>Отпечаток результатов тестов</dt><dd class="mono sm">${esc(r.testsDigest)}</dd></dl></details></section>
 ${fileBox()}`}
function fileBox(){return`<section class="panel"><h2>Сверить файл</h2><label class="drop" id="drop"><input type="file" id="vfile" hidden><span>Перетащите PDF, DOC или файл испытаний .json или <u>выберите файл</u>. Файл не отправляется в интернет — проверка идёт на вашем устройстве.</span></label>${verdict&&!verdict.form?`<div class="verdict ${verdict.c}"><b>${verdict.t}</b><div>${verdict.d}</div></div>`:''}</section>`}
function verify(){return`<section class="panel" id="verify"><h2>Проверить документ</h2><p class="hint">Отсканируйте QR-код на документе или введите номер и код проверки.</p>
 <form id="vf" class="vrow"><label>Номер документа<input id="vn" autocomplete="off" placeholder="ДП-2026-0001" value="${esc(vnum)}"></label><label>Код проверки<input id="vc" autocomplete="off" class="mono" placeholder="A1B2-C3D4-E5F6-0718" value="${esc(vcode)}"></label><button class="pri" type="submit">Проверить</button></form>
 ${verdict&&verdict.form?`<div class="verdict ${verdict.c}"><b>${verdict.t}</b><div>${verdict.d}</div></div>`:''}</section>${fileBox()}`}
function expert(){return`<section class="panel"><h2>Эксперт СДП</h2><p><b>Марченко Евгений Сергеевич</b>, независимый эксперт СДП, Санкт-Петербург. Документы о квалификации можно подтвердить в выдавших их организациях.</p><div class="tw"><table><thead><tr><th>Документ</th><th>Курс</th><th>Организация</th><th>Выдан</th><th>Контакт для проверки</th></tr></thead><tbody>${QUALS.map(q=>`<tr><td class="mono">${esc(q[0])}</td><td>${esc(q[1])}</td><td>${esc(q[2])}</td><td class="num">${q[3]}</td><td class="sub">${esc(q[4])}</td></tr>`).join('')}</tbody></table></div></section>`}
function check(n,c){const r=byNum(n);if(!r)return{form:1,c:'bad',t:'Документ не найден в реестре',d:'Номер «'+esc(n)+'» не зарегистрирован. Документ не подтверждён.'};
 const code=String(c||'').toUpperCase().replace(/[^0-9A-F]/g,'');if(code&&code!==SDPC.short(r.fp).replace(/-/g,''))return{form:1,c:'bad',t:'Код проверки не совпадает',d:`Номер ${esc(r.number)} есть в реестре, но код на документе другой: документ изменён или поддельный.`};
 if(!code)return{form:1,c:'mid',t:'Введите код проверки',d:`Номер ${esc(r.number)} зарегистрирован. Чтобы подтвердить подлинность бумаги, введите код с документа. <a href="#${SDPC.anchor(r.number)}">Данные из реестра</a>`};
 location.hash=SDPC.anchor(r.number);return null}
async function checkFile(f){verdict={c:'mid',t:'Проверка файла…',d:esc(f.name)};render();const buf=await f.arrayBuffer();const h=SDPC.sha256(buf);for(const r of R)if((r.files||[]).some(x=>x.sha256==h)){verdict={...stv(r),d:`Файл «${esc(f.name)}» побайтно совпадает с зарегистрированным оригиналом документа <a href="#${SDPC.anchor(r.number)}">${esc(r.number)}</a>.`};render();return}
 if(/\.json$/i.test(f.name)){try{const o=JSON.parse(new TextDecoder().decode(buf));const rec=o.type=='sdp-registry-record'?o.record:o.issue&&o.issue.record;if(rec){const reg=byNum(rec.number);const okRec=SDPC.fingerprint(rec)===rec.fp;const okTests=o.tests?SDPC.testsDigest(o.tests)===rec.testsDigest:true;
  verdict=!reg?{c:'bad',t:'Документ не найден в реестре',d:'Номер '+esc(rec.number)+' не зарегистрирован.'}:(!okRec||reg.fp!==rec.fp)?{c:'bad',t:'Данные изменены после выпуска',d:'Отпечаток записи не совпадает с реестром.'}:!okTests?{c:'bad',t:'Результаты тестов изменены после выпуска',d:'Листы тестов в файле отличаются от выпущенных.'}:{...stv(reg),d:`Файл испытаний соответствует документу <a href="#${SDPC.anchor(reg.number)}">${esc(reg.number)}</a>: данные не изменялись.`};render();return}}catch(e){}}
 verdict={c:'bad',t:'Файл не совпадает ни с одним зарегистрированным оригиналом',d:`SHA-256: <span class="mono sm">${h}</span>. Если оригинал не зарегистрирован, проверьте документ по номеру и коду.`};render()}
function bind(){const vf=$('#vf');if(vf)vf.onsubmit=e=>{e.preventDefault();vnum=$('#vn').value.trim();vcode=$('#vc').value;verdict=check(vnum,vcode);render()};
 const vfi=$('#vfile'),dr=$('#drop');if(vfi)vfi.onchange=()=>vfi.files[0]&&checkFile(vfi.files[0]);
 if(dr){dr.ondragover=e=>{e.preventDefault();dr.classList.add('on')};dr.ondragleave=()=>dr.classList.remove('on');dr.ondrop=e=>{e.preventDefault();dr.classList.remove('on');const f=e.dataTransfer.files[0];if(f)checkFile(f)}}}
window.addEventListener('hashchange',()=>{verdict=null;render();scrollTo(0,0)});
render();
fetch('registry.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{R=d.records||[];META=d.meta||{};state='ok';render()}).catch(()=>{state='err';render()});
})();
</script></body></html>

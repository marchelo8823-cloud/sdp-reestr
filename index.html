a{color:var(--acc)}

.chip.ok{background:var(--okb);color:var(--ok)}.chip.warn{background:var(--warnb);color:var(--warn)}.chip.bad{background:var(--badb);color:var(--bad)}.chip.mid{background:var(--midb);color:var(--mut)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}

td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.sub{font-size:12px;color:var(--mut)}
.mono{font-family:var(--fm)}.sm{font-size:12px;word-break:break-all}.num{font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.big{font-size:24px;margin:2px 0 0}

async function save(note){if(!AR){msg='Сохранение недоступно в этом просмотре.';render();return false}busy=true;D.meta.updated=today;
 const html=build();try{await AR.publish(html);msg=note||'Реестр сохранён.';render();return true}catch(e){const c=e&&e.code;msg=c=='conflict'?'Реестр одновременно изменили в другом окне. Страница обновится до последней версии — повторите действие.':c=='not_writer'||c=='not_granted'?'Нет прав на изменение реестра.':c=='too_large'?'Реестр превысил допустимый размер. Выгрузите архив и сообщите разработчику.':'Не удалось сохранить: '+esc(e&&e.message||c);render();return false}finally{busy=false}}
function build(){const g=id=>document.getElementById(id).textContent;const json=JSON.stringify(D).replace(/</g,'\\u003c');

async function addFiles(files){let added=0,errs=[];for(const f of files){try{const o=JSON.parse(await f.text());const r=o.type=='sdp-registry-record'?o.record:o.issue?.record||o;
 if(!r||!r.number||!r.fp)throw new Error('это не запись реестра');if(SDPC.fingerprint(r)!==r.fp)throw new Error('запись изменена после выпуска — отпечаток не совпадает');
 const ex=byNum(r.number);if(ex){if(ex.fp===r.fp){errs.push(`${r.number}: уже в реестре`);continue}throw new Error('номер уже занят другим документом')}
 const rec={...r,status:'действителен',addedAt:today,files:[]};if(r.supersedes){const old=byNum(r.supersedes);if(old){old.status='заменён';old.supersededBy=r.number}}
 D.records.push(rec);added++}catch(e){errs.push(`${esc(f.name)}: ${esc(e.message)}`)}}
 if(added)await save(`Добавлено записей: ${added}.`+(errs.length?' '+errs.join('; '):''));else{msg=errs.join('<br>')||'Нечего добавлять.';render()}}
async function attach(n,file){const r=byNum(n);if(!r)return;const buf=await file.arrayBuffer();const h=SDPC.sha256(buf);if((r.files||[]).some(x=>x.sha256==h)){msg='Этот файл уже прикреплён.';render();return}
 let up=null;if(ASSETS){try{up=await ASSETS.upload(file)}catch(e){msg='Файл не загружен в архив ('+esc(e.code||e.message)+'), сохранён только его отпечаток.'}}
 r.files=r.files||[];r.files.push({name:file.name,size:file.size,sha256:h,assetId:up?.id||'',url:up?.url||'',addedAt:today});await save(msg||'Файл прикреплён, отпечаток записан.')}

function check(n,c){const r=byNum(n);if(!r)return{c:'bad',t:'Документ не найден в реестре',d:'Номер «'+esc(n)+'» не зарегистрирован. Документ не подтверждён.'};
 const code=String(c||'').toUpperCase().replace(/[^0-9A-F]/g,'');if(code&&code!==SDPC.short(r.fp).replace(/-/g,''))return{c:'bad',t:'Код проверки не совпадает',d:`Номер ${esc(r.number)} есть в реестре, но код с документа другой. Документ изменён или поддельный. <a href="#${SDPC.anchor(r.number)}">Данные из реестра</a> — сверьте с бумагой.`};

async function checkFile(f){const buf=await f.arrayBuffer();const h=SDPC.sha256(buf);for(const r of D.records)if((r.files||[]).some(x=>x.sha256==h)){verdict={...stv(r),d:`Файл «${esc(f.name)}» совпадает с оригиналом документа <a href="#${SDPC.anchor(r.number)}">${esc(r.number)}</a> побайтно.`};render();return}
 if(/\.json$/i.test(f.name)){try{const o=JSON.parse(new TextDecoder().decode(buf));const rec=o.type=='sdp-registry-record'?o.record:o.issue?.record;if(rec){const reg=byNum(rec.number);const okRec=SDPC.fingerprint(rec)===rec.fp;const okTests=o.tests?SDPC.testsDigest(o.tests)===rec.testsDigest:true;
  if(!reg)verdict={c:'bad',t:'Документ не найден в реестре',d:'Номер '+esc(rec.number)+' не зарегистрирован.'};else if(!okRec||reg.fp!==rec.fp)verdict={c:'bad',t:'Данные изменены после выпуска',d:'Отпечаток записи не совпадает с реестром.'};else if(!okTests)verdict={c:'bad',t:'Результаты тестов изменены после выпуска',d:'Карточка совпадает, но листы тестов в файле отличаются от выпущенных.'};else verdict={...stv(reg),d:`Файл испытаний соответствует документу <a href="#${SDPC.anchor(reg.number)}">${esc(reg.number)}</a>: данные и результаты тестов не изменялись.`};render();return}}catch(e){}}
 verdict={c:'bad',t:'Файл не совпадает ни с одним документом реестра',d:`SHA-256: <span class="mono sm">${h}</span>. Если документ подлинный, его оригинал не прикреплён к записи — проверьте по номеру и коду.`};render()}

 const dr=$('#drop'),vfi=$('#vfile');if(vfi)vfi.onchange=()=>vfi.files[0]&&checkFile(vfi.files[0]);
 if(dr){dr.ondragover=e=>{e.preventDefault();dr.classList.add('on')};dr.ondragleave=()=>dr.classList.remove('on');dr.ondrop=e=>{e.preventDefault();dr.classList.remove('on');const f=e.dataTransfer.files[0];if(f)checkFile(f)}}
 const af=$('#addf');if(af)af.onchange=()=>addFiles([...af.files]);
 const at=$('#attf');if(at)at.onchange=()=>at.files[0]&&attach(at.dataset.n,at.files[0]);
 const q=$('#q');if(q)q.oninput=()=>{filter=q.value;const p=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
 const sf=$('#sf');if(sf)sf.onchange=()=>{stFilter=sf.value;render()};
 const es=$('#expS');if(es)es.onclick=()=>{const K=['number','supersedes','supersededBy','issuedAt','vessel','trial','programme','result','counts','findings','open','closed','expert','expertQuals','reissueOf','note','next','testsDigest','fp','status','statusNote'];const recs=D.records.map(r=>{const o={};K.forEach(k=>{if(k in r)o[k]=r[k]});o.files=(r.files||[]).map(f=>({name:f.name,sha256:f.sha256}));return o});exportFile('registry.json',JSON.stringify({meta:{url:D.meta.url||'',updated:D.meta.updated||today},records:recs},null,1),'application/json');msg='Файл registry.json сохранён. Загрузите его на сайт GitHub вместо старого (Add file → Upload files).';render()};
 const ej=$('#expJ');if(ej)ej.onclick=()=>exportFile('Реестр_СДП_'+today+'.json',JSON.stringify({type:'sdp-registry-export',exported:today,url:D.meta.url||'',records:D.records},null,1),'application/json');
 const ec=$('#expC');if(ec)ec.onclick=()=>exportFile('Реестр_СДП_'+today+'.csv',csv(),'text/csv');
 const ab=$('#annB');if(ab)ab.onclick=()=>{$('#annBox').hidden=false;$('#annR').focus()};const an=$('#annNo');if(an)an.onclick=()=>{$('#annBox').hidden=true};
 
 document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{closeIdx=+b.dataset.close;render();const n=$('#cn');if(n)n.focus()});
 const cc=$('#cc');if(cc)cc.onclick=()=>{closeIdx=null;render()};
 const cf=$('#cf');if(cf)cf.onsubmit=async e=>{e.preventDefault();const r=byNum(cf.dataset.n),i=+cf.dataset.i,o=(r.open||[])[i];const note=$('#cn').value.trim();if(!note){$('#cn').focus();return}r.closed=r.closed||[];if(!r.closed.some(c=>c.i===i))r.closed.push({i,cat:o.cat,text:o.text,date:$('#cd').value||today,note});closeIdx=null;await save('Замечание отмечено устранённым.')};
 document.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=async()=>{const h=decodeURIComponent(location.hash.slice(1));const r=D.records.find(x=>SDPC.anchor(x.number)==h);if(!r)return;r.closed=(r.closed||[]).filter(c=>c.i!==+b.dataset.reopen);await save('Замечание снова открыто.')});
 const ao=$('#annOk');if(ao)ao.onclick=async()=>{const why=$('#annR').value.trim();if(!why){$('#annR').focus();return}const r=byNum(ao.dataset.n);r.status='аннулирован';r.statusNote=why+' ('+fmt(today)+')';await save('Документ '+r.number+' аннулирован.')};}
window.addEventListener('hashchange',()=>{closeIdx=null;verdict=null;render();scrollTo(0,0)});
render();
(async()=>{try{const u=await claude.use('user');canEdit=!!(u&&await u.canEdit())}catch(e){}if(canEdit){try{AR=await claude.use('artifact')}catch(e){}try{ASSETS=await claude.use('assets')}catch(e){}}try{DL=await claude.use('downloads')}catch(e){}render()})();
})();
